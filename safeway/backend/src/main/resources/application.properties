server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/safeway}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:safeway}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:REMOVED}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

jwt.secret=${JWT_SECRET:change-this-jwt-secret-before-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

kakao.client-id=${KAKAO_CLIENT_ID:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/callback}
