server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/safeway}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:safeway}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

kakao.javascript-key=${KAKAO_JAVASCRIPT_KEY:}
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/callback}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
