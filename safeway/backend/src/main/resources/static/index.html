<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Safeway 로그인</title>
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
</head>
<body>
<h2>Safeway 테스트 페이지</h2>
<button onclick="loginWithKakao()" style="padding:10px 20px; background:#FEE500; border:none; border-radius:5px; cursor:pointer;">
    카카오 로그인
</button>

<script>
    Kakao.init('REMOVED'); // JavaScript 키

    function loginWithKakao() {
        Kakao.Auth.authorize({
            redirectUri: 'http://localhost:8080/callback'
        });
    }
</script>
</body>
</html>
